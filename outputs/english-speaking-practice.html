<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHL Style English Lab</title>
  <style>
    :root {
      --ink: #122b34;
      --muted: #63777f;
      --bg: #f3faf7;
      --panel: rgba(255, 255, 255, .94);
      --line: rgba(18, 43, 52, .12);
      --teal: #009c8f;
      --teal2: #006f72;
      --mint: #d9f4ee;
      --aqua: #7fd9cf;
      --coral: #ff725c;
      --gold: #f4b844;
      --nav: #0d5962;
      --green: #237b5b;
      --lav: #5867c6;
      --shadow: 0 22px 60px rgba(15, 67, 72, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 12%, rgba(127, 217, 207, .32), transparent 28%),
        radial-gradient(circle at 78% 8%, rgba(255, 114, 92, .16), transparent 24%),
        linear-gradient(135deg, #fbfffd 0%, var(--bg) 50%, #eef8f6 100%);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
    }

    button, select, textarea, input { font: inherit; }
    button { cursor: pointer; }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: .58;
    }

    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      gap: 0;
    }

    .rail {
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(245, 253, 250, .92));
      color: var(--ink);
      padding: 22px 18px;
      display: grid;
      align-content: start;
      gap: 18px;
      border-right: 1px solid rgba(0, 111, 114, .12);
      box-shadow: 10px 0 36px rgba(14, 80, 86, .08);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: white;
      background: linear-gradient(145deg, var(--teal), var(--teal2));
      box-shadow: 0 12px 26px rgba(0, 156, 143, .28);
    }

    .brand h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      border: 1px solid rgba(0, 111, 114, .14);
      background: linear-gradient(180deg, white, #f8fffd);
      border-radius: 12px;
      padding: 10px 8px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: .72rem;
    }

    .stat strong {
      display: block;
      margin-top: 5px;
      font-size: 1.15rem;
      color: var(--teal2);
    }

    .rail-group {
      display: grid;
      gap: 7px;
    }

    .nav-btn {
      min-height: 42px;
      border: 0;
      border-radius: 12px;
      padding: 0 12px;
      background: transparent;
      color: #37525b;
      text-align: left;
      font-weight: 750;
    }

    .nav-btn.active {
      color: var(--teal2);
      background: linear-gradient(90deg, rgba(0,156,143,.13), rgba(217,244,238,.5));
      box-shadow: inset 4px 0 0 var(--teal);
    }

    .rail-note {
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.4;
      border: 1px solid rgba(0,111,114,.12);
      background: rgba(217,244,238,.42);
      border-radius: 14px;
      padding: 13px;
    }

    .source-card {
      display: grid;
      gap: 8px;
      border: 1px solid rgba(0,111,114,.14);
      background: linear-gradient(135deg, rgba(0,156,143,.1), rgba(255,255,255,.82));
      border-radius: 14px;
      padding: 13px;
    }

    .source-card strong {
      color: var(--teal2);
      font-size: .9rem;
    }

    .auth-wrap {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(460px, 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--shadow);
      padding: 26px;
      display: grid;
      gap: 16px;
      backdrop-filter: blur(14px);
    }

    .auth-card h1 {
      margin: 0;
      font-size: 1.55rem;
    }

    .auth-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--muted);
      font-size: .84rem;
      font-weight: 800;
    }

    .field input {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      background: white;
      color: var(--ink);
    }

    .auth-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .user-chip {
      border: 1px solid rgba(0,111,114,.14);
      border-radius: 14px;
      background: rgba(217,244,238,.56);
      padding: 11px 12px;
      display: grid;
      gap: 6px;
    }

    .user-chip strong {
      color: var(--teal2);
    }

    .main {
      min-width: 0;
      padding: 24px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .topbar {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(0, 111, 114, .96), rgba(0, 156, 143, .91)),
        white;
      color: white;
      box-shadow: 0 22px 52px rgba(0, 91, 98, .2);
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(14px);
    }

    .topbar:after {
      content: "";
      position: absolute;
      right: -80px;
      top: -90px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 38px solid rgba(255,255,255,.12);
      pointer-events: none;
    }

    .topbar > * {
      position: relative;
      z-index: 1;
    }

    .topbar h2 {
      margin: 0;
      font-size: 1.26rem;
    }

    .topbar p {
      margin: 4px 0 0;
      color: rgba(255,255,255,.78);
      font-size: .9rem;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
    }

    .segmented {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(105px, 1fr));
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255,255,255,.12);
    }

    .segmented button {
      min-height: 40px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.8);
      font-weight: 850;
      padding: 0 12px;
    }

    .segmented button.active {
      background: white;
      color: var(--teal2);
    }

    select, .btn {
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 40px;
      background: white;
      color: var(--ink);
      padding: 0 12px;
      font-weight: 740;
    }

    .btn.primary {
      border-color: var(--teal);
      background: linear-gradient(135deg, var(--teal), var(--teal2));
      color: white;
      box-shadow: 0 10px 24px rgba(0, 156, 143, .22);
    }

    .btn.primary:hover { background: var(--teal2); }
    .btn:disabled { opacity: .52; cursor: not-allowed; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }

    .roadmap {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .part {
      border: 1px solid rgba(0,111,114,.14);
      border-radius: 12px;
      background: rgba(255,255,255,.78);
      padding: 10px;
      min-height: 78px;
      display: grid;
      align-content: space-between;
      box-shadow: 0 8px 24px rgba(18,43,52,.06);
    }

    .part b {
      color: var(--teal2);
      font-size: .8rem;
    }

    .part span {
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.25;
    }

    .side-card .roadmap {
      grid-template-columns: 1fr;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .result-tile {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, white, rgba(217,244,238,.42));
      padding: 14px;
    }

    .result-tile span {
      display: block;
      color: var(--muted);
      font-size: .8rem;
    }

    .result-tile strong {
      display: block;
      margin-top: 4px;
      color: var(--teal2);
      font-size: 1.35rem;
    }

    .rubric-list {
      display: grid;
      gap: 10px;
    }

    .rubric-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 42px;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: .84rem;
    }

    .rubric-bar {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e5efee;
    }

    .rubric-bar div {
      height: 100%;
      background: linear-gradient(90deg, var(--aqua), var(--teal));
    }

    .part.active {
      border-color: rgba(0,156,143,.48);
      background: linear-gradient(135deg, rgba(217,244,238,.9), white);
      box-shadow: inset 4px 0 0 var(--teal), 0 8px 24px rgba(0,156,143,.12);
    }

    .card, .side-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .card-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(255,255,255,.75), rgba(217,244,238,.58));
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--lav), var(--teal));
      font-weight: 850;
      font-size: .78rem;
      box-shadow: 0 8px 18px rgba(88,103,198,.18);
    }

    .timer {
      border-radius: 8px;
      padding: 7px 11px;
      color: #321910;
      background: linear-gradient(135deg, #ffd37a, var(--gold));
      font-weight: 900;
      min-width: 54px;
      text-align: center;
    }

    .prompt {
      min-height: 305px;
      padding: 32px;
      display: grid;
      align-content: center;
      gap: 18px;
      background:
        radial-gradient(circle at 88% 12%, rgba(0,156,143,.09), transparent 22%),
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(250,255,253,.92));
    }

    .sentence {
      font-size: clamp(1.55rem, 3vw, 2.55rem);
      line-height: 1.22;
      font-weight: 850;
      letter-spacing: 0;
      max-width: 940px;
    }

    .blank {
      display: inline-block;
      min-width: 120px;
      border-bottom: 5px solid var(--coral);
      transform: translateY(-3px);
    }

    .hint {
      color: var(--muted);
      line-height: 1.45;
      max-width: 850px;
      font-weight: 650;
    }

    .shadow-matrix {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .mini {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: linear-gradient(180deg, white, rgba(217,244,238,.36));
      font-size: .9rem;
      line-height: 1.36;
    }

    .mini strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .actions, .answer {
      border-top: 1px solid var(--line);
      padding: 15px 16px;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      background: rgba(250,255,253,.74);
    }

    .answer {
      display: grid;
    }

    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      color: var(--ink);
      line-height: 1.45;
      background: white;
      box-shadow: inset 0 1px 0 rgba(0,0,0,.02);
    }

    .feedback {
      border-top: 1px solid var(--line);
      padding: 16px;
      display: grid;
      gap: 10px;
    }

    .feedback h3, .side-card h3 {
      margin: 0;
      font-size: .96rem;
    }

    .line {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      background: rgba(255,255,255,.82);
      line-height: 1.42;
    }

    .line.good { border-color: rgba(40,124,83,.32); background: rgba(40,124,83,.08); }
    .line.warn { border-color: rgba(200,149,45,.36); background: rgba(200,149,45,.11); }
    .line.bad { border-color: rgba(212,91,76,.36); background: rgba(212,91,76,.1); }

    .side {
      display: grid;
      gap: 14px;
    }

    .side-card {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 9px;
      color: var(--teal2);
      background: rgba(217,244,238,.7);
      font-size: .8rem;
      font-weight: 800;
    }

    .meter {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: #e5efee;
    }

    .meter div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--coral), var(--gold), var(--teal));
      transition: width .28s ease;
    }

    .small {
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.45;
    }

    .chat {
      min-height: 620px;
      display: grid;
      grid-template-rows: auto minmax(290px, 1fr) auto;
      overflow: hidden;
    }

    .case-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .log {
      padding: 18px;
      display: grid;
      align-content: start;
      gap: 12px;
      overflow: auto;
      background:
        linear-gradient(180deg, rgba(248,255,252,.86), rgba(238,248,246,.68));
    }

    .bubble {
      max-width: min(760px, 92%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.45;
      background: white;
      box-shadow: 0 8px 24px rgba(18,43,52,.06);
    }

    .bubble.agent {
      justify-self: end;
      color: #083f43;
      background: linear-gradient(135deg, rgba(217,244,238,.94), rgba(127,217,207,.38));
      border-color: rgba(0,156,143,.24);
    }

    .bubble.coach {
      border-color: rgba(200,149,45,.4);
      background: rgba(200,149,45,.12);
    }

    @media (max-width: 1040px) {
      .shell { grid-template-columns: 1fr; }
      .rail { position: static; }
      .layout { grid-template-columns: 1fr; }
      .roadmap { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .rail-group { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .main { padding: 14px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .tools { justify-content: stretch; }
      .segmented, select, .btn { flex: 1 1 150px; }
      .prompt { padding: 20px 16px; min-height: 260px; }
      .sentence { font-size: 1.38rem; }
      .shadow-matrix, .rail-group, .stats, .roadmap { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const e = React.createElement;
    const { useEffect, useMemo, useRef, useState } = React;

    const modes = [
      { id: "amcat", label: "AMCAT sequence", sub: "Seven-part voice test path inspired by the reference video.", chips: ["A-G parts", "timed", "voice test"] },
      { id: "mixed", label: "Mixed test", sub: "Adaptive mix: missing word, grammar correction, shadowing and free speech.", chips: ["adaptive", "grammar", "listening", "speaking"] },
      { id: "shortq", label: "Short questions", sub: "Listen to a short story, then answer in full sentence form.", chips: ["Part A", "memory", "15 sec"] },
      { id: "convq", label: "Conversation", sub: "Listen to a situation/dialogue and answer naturally.", chips: ["Part B", "dialogue", "12 sec"] },
      { id: "read", label: "Read & speak", sub: "Read the text aloud with clarity, punctuation and pace.", chips: ["Part C", "reading", "clarity"] },
      { id: "blank", label: "Missing word", sub: "Complete the sentence with the most natural word.", chips: ["context", "vocabulary", "collocations"] },
      { id: "correct", label: "Sentence correction", sub: "Fix the grammar and say the correct version.", chips: ["accuracy", "tense", "word order"] },
      { id: "shadow", label: "Listen & repeat", sub: "Repeat with accurate rhythm, stress, linking and clear sounds.", chips: ["Part D", "accent", "intonation"] },
      { id: "free", label: "Quick response", sub: "Answer clearly under time pressure.", chips: ["fluency", "structure", "confidence"] }
    ];

    const amcatParts = [
      ["A", "Short questions", "Story + 3 answers"],
      ["B", "Conversation", "Situation + dialogue"],
      ["C", "Read & speak", "Read aloud"],
      ["D", "Listen & repeat", "Repeat exactly"],
      ["E", "Fill blanks", "Best missing word"],
      ["F", "Complete sentence", "Finish naturally"],
      ["G", "Free speech", "Structured answer"]
    ];

    const dimensionLabels = {
      activeListening: "Escucha",
      fluency: "Fluidez",
      pronunciation: "Pronunciacion",
      grammar: "Gramatica",
      vocabulary: "Vocabulario",
      structure: "Estructura"
    };

    const rubricByType = {
      shortq: { activeListening: 40, structure: 25, grammar: 20, pronunciation: 15 },
      convq: { activeListening: 45, structure: 20, grammar: 20, pronunciation: 15 },
      read: { pronunciation: 40, fluency: 35, activeListening: 15, grammar: 10 },
      shadow: { pronunciation: 40, activeListening: 35, fluency: 25 },
      blank: { vocabulary: 45, grammar: 30, activeListening: 15, fluency: 10 },
      correct: { grammar: 55, structure: 25, fluency: 10, pronunciation: 10 },
      free: { fluency: 30, structure: 25, grammar: 20, pronunciation: 15, vocabulary: 10 }
    };

    const questions = {
      shortq: [
        ["easy","story memory","Story: Your name is Maria. You are 28 years old. You enjoy cooking and usually cook dinner after work. Question: How old are you?","I am 28 years old.","Answer in a complete sentence, not one word."],
        ["easy","story memory","Story: David works at a bookstore. He starts work at 9 a.m. and helps customers find books. Question: Where does David work?","David works at a bookstore.","Use the subject from the question."],
        ["easy","story memory","Story: Ana missed the bus because she woke up late. She called her manager to explain the delay. Question: Why did Ana miss the bus?","Ana missed the bus because she woke up late.","Use because for the reason."],
        ["medium","story memory","Story: Kevin ordered a blue backpack online, but the store delivered a black one. He contacted support to request an exchange. Question: What color backpack did Kevin order?","Kevin ordered a blue backpack.","Keep it short but complete."],
        ["medium","story memory","Story: Lisa has a dentist appointment on Friday morning. She moved her team meeting to the afternoon. Question: When is Lisa's dentist appointment?","Lisa's dentist appointment is on Friday morning.","Use is on for schedule."],
        ["medium","story memory","Story: A customer lost his wallet at the airport. He reported it to security and cancelled his cards. Question: What did the customer cancel?","The customer cancelled his cards.","Use past tense."],
        ["hard","story memory","Story: Nina received a message about suspicious activity on her account. She changed her password and enabled two-factor authentication. Question: What security step did Nina enable?","Nina enabled two-factor authentication.","Say the key phrase clearly."],
        ["hard","story memory","Story: The airline delayed the flight due to severe weather. Passengers received food vouchers and updated departure information. Question: Why was the flight delayed?","The flight was delayed due to severe weather.","Use due to or because of."]
      ],
      convq: [
        ["easy","conversation","Situation: A customer calls a bank. Customer: I lost my card this morning. Agent: I can help you block it after verifying your identity. Question: What does the customer want to do?","The customer wants to block the lost card.","Answer from the customer's goal."],
        ["easy","conversation","Situation: Two coworkers discuss a meeting. Anna: The meeting starts at 3 p.m. Mark: I will join five minutes early. Question: What time does the meeting start?","The meeting starts at 3 p.m.","Use starts, not start."],
        ["medium","conversation","Situation: A traveler speaks to airline support. Traveler: My suitcase did not arrive. Agent: Please give me your flight number and baggage tag. Question: What information does the agent request?","The agent requests the flight number and baggage tag.","Mention both pieces of information."],
        ["medium","conversation","Situation: A customer reports a login issue. Customer: I reset my password, but I still cannot access the account. Agent: I will check if the account is locked. Question: What problem does the customer still have?","The customer still cannot access the account.","Use still for continued problem."],
        ["hard","conversation","Situation: A patient calls a clinic. Patient: I need to reschedule because I have a work emergency. Receptionist: We have an opening tomorrow at 10. Question: Why does the patient need to reschedule?","The patient needs to reschedule because of a work emergency.","Use because of for reason."],
        ["hard","conversation","Situation: A guest contacts a hotel. Guest: I booked a non-smoking room, but the room smells like smoke. Agent: I can move you to another room. Question: What solution does the agent offer?","The agent offers to move the guest to another room.","Use offers to + verb."]

    function contentId(type, text, answer) {
      const source = `${type}|${text}|${answer}`;
      let hash = 0;
      for (let i = 0; i < source.length; i += 1) {
        hash = ((hash << 5) - hash + source.charCodeAt(i)) | 0;
      }
      return `${type}-${Math.abs(hash).toString(36)}`;
    }

    function itemize(type, raw) {
      return raw.map(row => ({ type, id: contentId(type, row[2], row[3]), level: row[0], topic: row[1], text: row[2], answer: row[3], hint: row[4], stress: row[5] || [], linking: row[6] || [], sounds: row[7] || [] }));
    }

    function cleanUsername(name) {
      return String(name || "").trim().toLowerCase().replace(/\s+/g, "_");
    }

    function normalize(text) {
      return String(text || "").toLowerCase().replace(/[.,!?;:'"()]/g, "").replace(/\s+/g, " ").trim();
    }

    function similarity(a, b) {
      const aa = normalize(a).split(" ").filter(Boolean);
      const bb = normalize(b).split(" ").filter(Boolean);
      if (!aa.length || !bb.length) return 0;
      const setB = new Set(bb);
      const common = aa.filter(word => setB.has(word)).length;
      return Math.round((common / Math.max(aa.length, bb.length)) * 100);
    }

    function speak(text, accent, rate) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = accent;
      u.rate = Number(rate);
      u.pitch = 1;
      speechSynthesis.speak(u);
    }

    function useMic(accent, setStatus) {
      const recognitionRef = useRef(null);
      const [recording, setRecording] = useState(false);

      async function ensureMic() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("Microfono: este navegador no expone getUserMedia. Prueba en Chrome.");
          return false;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
          setStatus("Microfono: permiso concedido. Habla cerca del micro y evita ruido de fondo.");
          return true;
        } catch {
          setStatus("Microfono: permiso bloqueado o dispositivo no disponible.");
          return false;
        }
      }

      async function start(setText, continuous = false) {
        if (!(await ensureMic())) return;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setStatus("Reconocimiento de voz no disponible aqui. Abre esta pagina en Google Chrome.");
          return;
        }
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch {}
        }
        let finalText = "";
        setText("");
        const rec = new SpeechRecognition();
        recognitionRef.current = rec;
        rec.lang = accent;
        rec.interimResults = true;
        rec.continuous = continuous;
        rec.maxAlternatives = 3;
        rec.onresult = event => {
          let interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (result.isFinal) finalText += `${result[0].transcript} `;
            else interim += result[0].transcript;
          }
          setText(`${finalText}${interim}`.trim());
          const confidence = event.results[event.results.length - 1]?.[0]?.confidence;
          setStatus(confidence ? `Escuchando... confianza aproximada ${(confidence * 100).toFixed(0)}%.` : "Escuchando... termina la frase completa.");
        };
        rec.onerror = event => setStatus(`Reconocimiento de voz: ${event.error}. Si falla, prueba Chrome.`);
        rec.onend = () => {
          setRecording(false);
          setStatus("Grabacion detenida. Revisa la transcripcion antes de revisar o enviar.");
        };
        rec.start();
        setRecording(true);
        setStatus("Escuchando...");
      }

      function stop() {
        if (recognitionRef.current) recognitionRef.current.stop();
      }

      return { recording, start, stop, ensureMic };
    }

    function ThreeScene() {
      useEffect(() => {
        if (!window.THREE) return;
        const canvas = document.getElementById("scene");
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 100);
        camera.position.set(0, 0, 18);
        const group = new THREE.Group();
        scene.add(group);

        const materialA = new THREE.MeshStandardMaterial({ color: 0x7fd9cf, metalness: .08, roughness: .5, transparent: true, opacity: .62 });
        const materialB = new THREE.MeshStandardMaterial({ color: 0xff725c, metalness: .08, roughness: .56, transparent: true, opacity: .5 });
        const materialC = new THREE.MeshStandardMaterial({ color: 0xf4b844, metalness: .08, roughness: .5, transparent: true, opacity: .55 });
        const materialD = new THREE.MeshStandardMaterial({ color: 0x5867c6, metalness: .08, roughness: .5, transparent: true, opacity: .36 });
        const sphere = new THREE.SphereGeometry(.62, 32, 32);
        const torus = new THREE.TorusGeometry(.78, .12, 16, 52);
        const capsule = new THREE.CapsuleGeometry(.28, .9, 8, 16);
        const geos = [sphere, torus, capsule];
        const mats = [materialA, materialB, materialC, materialD];
        for (let i = 0; i < 34; i++) {
          const mesh = new THREE.Mesh(geos[i % geos.length], mats[i % mats.length]);
          const angle = i * .74;
          const radius = 5 + (i % 8) * .72;
          const x = Math.cos(angle) * radius + (i % 3 === 0 ? 8 : -3);
          const y = Math.sin(angle) * radius * .42 + (i % 2 ? 2.6 : -1.3);
          mesh.position.set(x, y, -7 - (i % 7) * 1.55);
          mesh.rotation.set(i * .18, i * .27, i * .11);
          mesh.scale.setScalar(.58 + (i % 5) * .08);
          group.add(mesh);
        }
        scene.add(new THREE.AmbientLight(0xffffff, .75));
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(3, 8, 8);
        scene.add(light);

        function resize() {
          renderer.setSize(innerWidth, innerHeight, false);
          renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
        }
        resize();
        addEventListener("resize", resize);
        let frame;
        function animate(t) {
          group.rotation.y = t * .00005;
          group.rotation.x = Math.sin(t * .00012) * .055;
          group.children.forEach((mesh, i) => {
            mesh.rotation.x += .0018 + i * .000006;
            mesh.rotation.y += .0024;
          });
          renderer.render(scene, camera);
          frame = requestAnimationFrame(animate);
        }
        animate(0);
        return () => {
          cancelAnimationFrame(frame);
          removeEventListener("resize", resize);
          renderer.dispose();
          sphere.dispose();
          torus.dispose();
          capsule.dispose();
          materialA.dispose();
          materialB.dispose();
          materialC.dispose();
          materialD.dispose();
        };
      }, []);
      return null;
    }

          return;
        }
        if (modeOverride === "signup") {
          if (accounts[username]) {
            setAuthMessage("Ese usuario ya existe. Inicia sesion o usa otro nombre.");
            return;
          }
          const nextAccounts = { ...accounts, [username]: { password: authPass, usedQuestionIds: [], createdAt: new Date().toISOString() } };
          persistAccounts(nextAccounts);
          localStorage.setItem(ACTIVE_USER_KEY, username);
          setCurrentUser(username);
          setAuthName("");
          setAuthPass("");
          setAuthMessage("");
          return;
        }
        if (!accounts[username] || accounts[username].password !== authPass) {
          setAuthMessage("Usuario o password incorrecto.");
          return;
        }
        localStorage.setItem(ACTIVE_USER_KEY, username);
        setCurrentUser(username);
        setAuthName("");
        setAuthPass("");
        setAuthMessage("");
      }

      function logout() {
        localStorage.removeItem(ACTIVE_USER_KEY);
        setCurrentUser("");
        setAmcatTest({ active: false, complete: false, index: 0, plan: [], results: [] });
        setCurrent(null);
      }

      function unusedOnly(items) {
        return items.filter(item => !usedIds.has(item.id));
      }

      function pool() {
        const all = mode === "mixed"
          ? Object.values(bank).flat()
          : mode === "amcat"
            ? ["shortq", "convq", "read", "shadow", "blank", "correct", "free"].flatMap(key => bank[key] || [])
            : bank[mode];
        const unseen = unusedOnly(all);
        const filtered = unseen.filter(item => item.level === level);
        return filtered.length ? filtered : unseen;
      }

      function secondsFor(item) {
        return item?.type === "shortq" ? 15 : item?.type === "convq" ? 12 : item?.type === "read" ? 40 : item?.type === "free" ? 60 : 45;
      }

      const sectionInfo = {
        shortq: { part: "A", title: "Short questions", guide: "Escucharas una historia corta. Se evalua escucha activa, respuesta completa, gramatica basica y claridad de pronunciacion." },
        convq: { part: "B", title: "Conversation", guide: "Escucharas una situacion y un dialogo. Se evalua comprension del dialogo, respuesta especifica, estructura y gramatica." },
        read: { part: "C", title: "Read & speak", guide: "Lee el texto en voz alta. Se evalua fluidez, pronunciacion, ritmo, ausencia de pausas largas y claridad." },
        shadow: { part: "D", title: "Listen & repeat", guide: "Escucha y repite lo mas parecido posible. Se evalua pronunciacion, escucha activa, stress, ritmo y palabras omitidas." },
        blank: { part: "E", title: "Fill in the blanks", guide: "Completa la palabra faltante y di la oracion completa. Se evalua vocabulario contextual, gramatica y fluidez." },
        correct: { part: "F", title: "Complete/correct sentence", guide: "Corrige la frase con estructura correcta. Se evalua principalmente gramatica, estructura y claridad." },
        free: { part: "G", title: "Free speech", guide: "Responde con idea, razon y ejemplo. Se evalua fluidez, estructura, gramatica, pronunciacion y vocabulario." }
      };

      function buildAmcatPlan() {
        const counts = { shortq: 3, convq: 3, read: 2, shadow: 3, blank: 5, correct: 5, free: 2 };
        return Object.entries(counts).flatMap(([type, count]) => {
          const unused = unusedOnly(bank[type] || []);
          const preferred = unused.filter(item => item.level === level);
          const source = preferred.length >= count ? preferred : unused;
          return source.slice(0, count).map((item, index) => ({ ...sectionInfo[type], item, type, q: index + 1, count }));
        });
      }

      function startFullAmcat() {
        const plan = buildAmcatPlan();
        const requiredCount = 20;
        if (plan.length < requiredCount) {
          setFeedback([
            { type: "bad", text: "No quedan suficientes preguntas nuevas para una prueba AMCAT completa con este usuario." },
            { type: "warn", text: `Disponibles: ${plan.length}/${requiredCount}. Crea otro usuario o agrega mas preguntas al banco.` }
          ]);
          return;
        }
        const first = plan[0];
        markQuestionsUsed(plan.map(slot => slot.item));
        setAmcatTest({ active: true, complete: false, index: 0, plan, results: [] });
        setCurrent(first.item);
        setAnswer("");
        setScore(0);
        setTime(secondsFor(first.item));
        setFeedback([
          { type: "warn", text: `Part ${first.part}: ${first.title}` },
          { type: "", text: first.guide },
          { type: "", text: `Pregunta ${first.q} de ${first.count}. Presiona Escuchar, graba tu respuesta y luego Enviar y continuar.` }
        ]);
      }

      function englishLevel(avg) {
        if (avg >= 82) return "B2";
        if (avg >= 64) return "B1";
        return "A2";
      }

      function passStatus(avg, results) {
        const attempted = results.filter(r => r.score > 0).length;
        return avg >= 68 && attempted >= Math.ceil(results.length * .85) ? "PASO" : "NO PASO";
      }

      function newRound() {
        if (mode === "amcat" && amcatTest.active) return;
        const list = pool();
        if (!list.length) {
          setCurrent(null);
          setAnswer("");
          setScore(0);
          setFeedback([
            { type: "bad", text: "No quedan preguntas nuevas para este modo con el usuario actual." },
            { type: "warn", text: "Regla activa: una pregunta usada nunca se repite para el mismo usuario." }
          ]);
          return;
        }
        const item = list[Math.floor(Math.random() * list.length)];
        markQuestionsUsed([item]);
        setCurrent(item);
        setAnswer("");
        setFeedback([{ type: "", text: "Listo para tu intento. Escucha, graba y revisa." }]);
        setScore(0);
        setTime(secondsFor(item));
        setStats(s => ({ ...s, rounds: s.rounds + 1 }));
      }

      useEffect(() => {
        if (mode === "amcat") {
          setCurrent(null);
          setAnswer("");
          setScore(0);
          setAmcatTest({ active: false, complete: false, index: 0, plan: [], results: [] });
          setFeedback([{ type: "warn", text: "AMCAT Sequence listo. Presiona Iniciar prueba completa para hacer Part A hasta Part G." }]);
          return;
        }
        newRound();
      }, [mode, level]);

      useEffect(() => {
        if (flow !== "speaking") return;
        const id = setInterval(() => setTime(t => Math.max(0, t - 1)), 1000);
        return () => clearInterval(id);
      }, [flow, current?.id]);

      function countMatches(text, words) {
        const said = normalize(text).split(" ");
        return (words || []).filter(word => said.includes(normalize(word))).length;
      }

      function clampScore(value) {
        return Math.max(0, Math.min(100, Math.round(value)));
      }

      function wordCount(text) {
        return normalize(text).split(" ").filter(Boolean).length;
      }

      function fillerPenalty(text) {
        const lowered = normalize(text);
        const fillers = ["um", "uh", "er", "ah", "like", "you know", "mmm"];
        return fillers.reduce((sum, filler) => sum + (lowered.includes(filler) ? 12 : 0), 0);
      }

      function hasSentenceShape(text) {
        const words = normalize(text).split(" ").filter(Boolean);
        return words.length >= 5 && /\b(am|is|are|was|were|do|does|did|have|has|had|can|will|would|should|need|want|ordered|works|starts|lost|filed|blocked|received)\b/i.test(text);
      }

      function grammarProxy(text) {
        let value = hasSentenceShape(text) ? 78 : 48;
        const commonIssues = [
          /\bi am agree\b/i,
          /\bshe don't\b/i,
          /\bhe go\b/i,
          /\bi no have\b/i,
          /\bneed take\b/i,
          /\bmore easier\b/i,
          /\bdidn't went\b/i,
          /\bhas not arrived already\b/i
        ];
        value -= commonIssues.filter(pattern => pattern.test(text)).length * 16;
        if (/[.!?]$/.test(text.trim())) value += 5;
        return clampScore(value);
      }

      function fluencyProxy(text, targetWords = 18) {
        const words = wordCount(text);
        const lengthScore = clampScore((words / targetWords) * 100);
        return clampScore(lengthScore - fillerPenalty(text));
      }

      function vocabularyProxy(text) {
        const words = normalize(text).split(" ").filter(Boolean);
        const unique = new Set(words);
        const ratio = words.length ? unique.size / words.length : 0;
        return clampScore(45 + ratio * 45 + Math.min(words.length, 30));
      }

      function weightedScore(dimensions, weights) {
        const entries = Object.entries(weights);
        const total = entries.reduce((sum, item) => sum + item[1], 0);
        return clampScore(entries.reduce((sum, [key, weight]) => sum + (dimensions[key] || 0) * weight, 0) / total);
      }

      function rubricLines(dimensions, weights) {
        return Object.keys(weights).map(key => ({
          type: dimensions[key] >= 80 ? "good" : dimensions[key] >= 60 ? "warn" : "bad",
          text: `${dimensionLabels[key]}: ${dimensions[key]}% (${weights[key]}% del score)`
        }));
      }

      function evaluateResponse(item, response) {
        let nextScore = 0;
        const lines = [];
        const weights = rubricByType[item.type] || rubricByType.free;
        let dimensions = {};
        if (!response) {
          dimensions = Object.fromEntries(Object.keys(weights).map(key => [key, 0]));
          return { score: 0, dimensions, lines: [{ type: "bad", text: "No detecte respuesta. Graba de nuevo o escribe lo que dijiste." }, ...rubricLines(dimensions, weights)] };
        }
        if (item.type === "blank") {
          const target = normalize(item.answer);
          const hasWord = normalize(response).split(" ").includes(target);
          dimensions = {
            vocabulary: hasWord ? 100 : similarity(response, item.answer),
            grammar: hasWord && hasSentenceShape(response) ? 88 : grammarProxy(response),
            activeListening: hasWord ? 90 : 45,
            fluency: fluencyProxy(response, 8)
          };
          nextScore = weightedScore(dimensions, weights);
          lines.push({ type: hasWord ? "good" : "bad", text: hasWord ? `Correcto: ${item.answer}` : `Esperado: ${item.answer}` });
          lines.push({ type: "warn", text: `Oracion completa: ${item.text.replace("____", item.answer)}` });
        }
        if (item.type === "shortq" || item.type === "convq") {
          const modelMatch = similarity(response, item.answer);
          const words = normalize(response).split(" ").filter(Boolean).length;
          dimensions = {
            activeListening: modelMatch,
            structure: words >= 5 ? 86 : 35,
            grammar: grammarProxy(response),
            pronunciation: clampScore(modelMatch * .65 + fluencyProxy(response, 8) * .35)
          };
          if (words < 5) dimensions.structure = Math.min(dimensions.structure, 35);
          nextScore = weightedScore(dimensions, weights);
          lines.push({ type: nextScore >= 78 ? "good" : nextScore >= 55 ? "warn" : "bad", text: `Modelo: ${item.answer}` });
          lines.push({ type: "warn", text: words < 5 ? "En este formato debes responder en forma de oracion, no con una sola palabra." : item.hint });
        }
        if (item.type === "correct") {
          const modelMatch = similarity(response, item.answer);
          dimensions = {
            grammar: modelMatch,
            structure: hasSentenceShape(response) ? 86 : 45,
            fluency: fluencyProxy(response, 8),
            pronunciation: clampScore(modelMatch * .55 + fluencyProxy(response, 8) * .45)
          };
          nextScore = weightedScore(dimensions, weights);
          lines.push({ type: nextScore >= 82 ? "good" : nextScore >= 55 ? "warn" : "bad", text: `Correcta: ${item.answer}` });
          lines.push({ type: "warn", text: item.hint });
        }
        if (item.type === "shadow") {
          const base = similarity(response, item.answer);
          const stress = Math.round((countMatches(response, item.stress) / Math.max(1, item.stress.length)) * 100);
          const wordGap = Math.abs(normalize(response).split(" ").length - normalize(item.answer).split(" ").length);
          const rhythm = Math.max(0, 100 - wordGap * 12);
          dimensions = {
            pronunciation: clampScore(base * .55 + stress * .25 + rhythm * .20),
            activeListening: base,
            fluency: rhythm
          };
          nextScore = weightedScore(dimensions, weights);
          lines.push({ type: nextScore >= 86 ? "good" : nextScore >= 65 ? "warn" : "bad", text: `Precision shadowing: ${nextScore}%. Texto ${base}%, stress ${stress}%, ritmo ${rhythm}%.` });
          lines.push({ type: "warn", text: `Stress: ${item.stress.join(", ")}` });
          lines.push({ type: "warn", text: `Linking: ${item.linking.join(" | ")}` });
          lines.push({ type: "warn", text: `Sounds: ${item.sounds.join(" | ")}` });
        }
        if (item.type === "read") {
          const base = similarity(response, item.answer);
          const wordGap = Math.abs(normalize(response).split(" ").length - normalize(item.answer).split(" ").length);
          const rhythm = Math.max(0, 100 - wordGap * 10);
          dimensions = {
            pronunciation: clampScore(base - wordGap * 4),
            fluency: clampScore(rhythm - fillerPenalty(response)),
            activeListening: base,
            grammar: grammarProxy(response)
          };
          nextScore = weightedScore(dimensions, weights);
          lines.push({ type: nextScore >= 86 ? "good" : nextScore >= 65 ? "warn" : "bad", text: `Read & speak precision: ${nextScore}%. Modelo: ${item.answer}` });
          lines.push({ type: "warn", text: item.hint });
        }
        if (item.type === "free") {
          const words = normalize(response).split(" ").filter(Boolean).length;
          const hasReason = /\b(because|since|for example|for instance|so|therefore|first|second|also)\b/i.test(response);
          dimensions = {
            fluency: fluencyProxy(response, 38),
            structure: clampScore((words >= 28 ? 70 : words * 2) + (hasReason ? 25 : 0)),
            grammar: grammarProxy(response),
            pronunciation: fluencyProxy(response, 30),
            vocabulary: vocabularyProxy(response)
          };
          nextScore = weightedScore(dimensions, weights);
          lines.push({ type: words >= 28 ? "good" : words >= 14 ? "warn" : "bad", text: `Usaste ${words} palabras. Busca 30 a 45 palabras con idea, razon y ejemplo.` });
          lines.push({ type: "warn", text: item.hint });
        }
        return { score: nextScore, dimensions, lines: [...lines, ...rubricLines(dimensions, weights)] };
      }

      function review() {
        if (!current) return;
        const result = evaluateResponse(current, answer.trim());
        const nextScore = result.score;
        setScore(nextScore);
        setFeedback(result.lines);
        setStats(s => nextScore >= 82 ? { rounds: s.rounds, wins: s.wins + 1, streak: s.streak + 1 } : { ...s, streak: 0 });
      }

      function submitAmcatAnswer() {
        if (!amcatTest.active || amcatTest.complete || !current) return;
        const slot = amcatTest.plan[amcatTest.index];
        const result = evaluateResponse(current, answer.trim());
        const saved = [...amcatTest.results, {
          part: slot.part,
          title: slot.title,
          type: current.type,
          score: result.score,
          dimensions: result.dimensions,
          answer: answer.trim()
        }];
        setScore(result.score);
        setStats(s => result.score >= 82 ? { rounds: s.rounds + 1, wins: s.wins + 1, streak: s.streak + 1 } : { rounds: s.rounds + 1, wins: s.wins, streak: 0 });

        const nextIndex = amcatTest.index + 1;
        if (nextIndex >= amcatTest.plan.length) {
          const avg = Math.round(saved.reduce((sum, item) => sum + item.score, 0) / saved.length);
          const levelName = englishLevel(avg);
          const statusName = passStatus(avg, saved);
          setAmcatTest({ ...amcatTest, active: false, complete: true, results: saved, index: nextIndex });
          setCurrent(null);
          setAnswer("");
          setTime(0);
          setFeedback([
            { type: statusName === "PASO" ? "good" : "bad", text: `Resultado final: ${statusName}` },
            { type: "warn", text: `Promedio: ${avg}%. Nivel estimado: ${levelName}.` },
            { type: "", text: levelName === "B2" ? "Puedes responder con buena estructura y claridad. Enfocate en sonar mas natural y consistente." : levelName === "B1" ? "Tienes base funcional. Mejora velocidad, oraciones completas y precision gramatical." : "Necesitas reforzar estructura basica, pronunciacion clara y respuestas completas antes de intentar la prueba real." }
          ]);
          return;
        }

        const nextSlot = amcatTest.plan[nextIndex];
        const sectionChanged = nextSlot.part !== slot.part;
        setAmcatTest({ ...amcatTest, index: nextIndex, results: saved });
        setCurrent(nextSlot.item);
        setAnswer("");
        setTime(secondsFor(nextSlot.item));
        setFeedback([
          ...result.lines,
          { type: "good", text: `Guardado: Part ${slot.part}, pregunta ${slot.q}/${slot.count}. Score: ${result.score}%.` },
          sectionChanged
            ? { type: "warn", text: `Siguiente seccion: Part ${nextSlot.part} - ${nextSlot.title}. ${nextSlot.guide}` }
            : { type: "", text: `Siguiente pregunta: ${nextSlot.q}/${nextSlot.count} en Part ${nextSlot.part}.` }
        ]);
      }

      function renderPrompt() {
        if (!current) return null;
        if (current.type === "shortq" || current.type === "convq") {
          const marker = current.type === "shortq" ? "Question:" : "Question:";
          const idx = current.text.indexOf(marker);
          const lead = idx >= 0 ? current.text.slice(0, idx).trim() : current.text;
          const q = idx >= 0 ? current.text.slice(idx).trim() : "";
          return e(React.Fragment, null,
            e("div", { className: "mini" }, e("strong", null, current.type === "shortq" ? "Listen to the story" : "Listen to the situation"), lead),
            e("div", { className: "sentence" }, q)
          );
        }
        if (current.type === "blank") {
          const parts = current.text.split("____");
          return e("div", { className: "sentence" }, parts[0], e("span", { className: "blank" }), parts[1]);
        }
        if (current.type === "shadow") {
          return e(React.Fragment, null,
            e("div", { className: "sentence" }, current.text),
            e("div", { className: "shadow-matrix" },
              e("div", { className: "mini" }, e("strong", null, "Chunks"), current.hint),
              e("div", { className: "mini" }, e("strong", null, "Stress"), current.stress.join(", ")),
              e("div", { className: "mini" }, e("strong", null, "Linking"), current.linking.join(" | ")),
              e("div", { className: "mini" }, e("strong", null, "Sounds"), current.sounds.join(" | "))
            )
          );
        }
        return e("div", { className: "sentence" }, current.text);
      }

      function resetCase(nextCase = caseId) {
        const c = chatCases[nextCase];
        setCaseId(nextCase);
        setStep(0);
        setChatInput("");
        setChatScore(0);
        setChatDecision("La IA decide si avanzar, repetir o pedir detalle.");
        setChatLog([{ who: "customer", text: c.steps[0][0] }]);
        speak(c.steps[0][0], accent, rate);
      }

      useEffect(() => { resetCase(caseId); }, []);

      function evaluateChat(text, data) {
        const said = normalize(text);
        const required = data[1];
        const hits = required.filter(pattern => new RegExp(`\\b(${pattern})\\b`, "i").test(said)).length;
        const words = said.split(" ").filter(Boolean).length;
        let value = Math.round(hits / required.length * 78);
        if (words >= 18) value += 12;
        if (/sorry|understand|apologize|help|assist/i.test(said)) value += 10;
        return { score: Math.min(100, value), pass: hits >= Math.ceil(required.length * .67) && words >= 10 };
      }

      function sendChat() {
        const text = chatInput.trim();
        if (!text) {
          setChatLog(log => [...log, { who: "coach", text: "No detecte respuesta. Graba o escribe tu respuesta antes de enviar." }]);
          return;
        }
        const data = activeCase.steps[step];
        const result = evaluateChat(text, data);
        setChatScore(result.score);
        setChatLog(log => [...log, { who: "agent", text }, { who: "coach", text: result.pass ? data[2] : data[3] }]);
        setChatDecision(result.pass ? "Decision: avanzar al siguiente turno." : "Decision: no avanzar todavia. Repite con mas informacion.");
        setChatInput("");
        if (result.pass) {
          const next = step + 1;
          if (next >= activeCase.steps.length) {
            setTimeout(() => setChatLog(log => [...log, { who: "coach", text: "Caso finalizado. Buen cierre: resolviste, confirmaste y mantuviste tono profesional." }]), 350);
          } else {
            setStep(next);
            setTimeout(() => {
              const customer = activeCase.steps[next][0];
              setChatLog(log => [...log, { who: "customer", text: customer }]);
              speak(customer, accent, rate);
            }, 450);
          }
        }
      }

      const currentSlot = amcatTest.plan[amcatTest.index];
      const finalAvg = amcatTest.results.length ? Math.round(amcatTest.results.reduce((sum, item) => sum + item.score, 0) / amcatTest.results.length) : 0;
      const finalLevel = englishLevel(finalAvg);
      const finalStatus = passStatus(finalAvg, amcatTest.results);
      const sectionScores = amcatParts.map(part => {
        const items = amcatTest.results.filter(item => item.part === part[0]);
        const avg = items.length ? Math.round(items.reduce((sum, item) => sum + item.score, 0) / items.length) : 0;
        return { part: part[0], title: part[1], avg, count: items.length };
      });
      const dimensionScores = Object.keys(dimensionLabels).map(key => {
        const values = amcatTest.results.map(item => item.dimensions?.[key]).filter(value => typeof value === "number");
        const avg = values.length ? Math.round(values.reduce((sum, value) => sum + value, 0) / values.length) : 0;
        return { key, label: dimensionLabels[key], avg, count: values.length };
      }).filter(item => item.count > 0);
      const currentWeights = current ? (rubricByType[current.type] || rubricByType.free) : null;

      if (!currentUser || !accounts[currentUser]) {
        return e(React.Fragment, null,
          e(ThreeScene),
          e("div", { className: "auth-wrap" },
            e("div", { className: "auth-card" },
              e("div", { className: "brand" }, e("div", { className: "logo" }, "EN"), e("div", null, e("h1", null, "AMCAT Practice Lab"), e("small", null, "Pregunta usada, pregunta bloqueada"))),
              e("p", null, "Crea una cuenta local o inicia sesion. Cada usuario guarda su historial y nunca recibe de nuevo una pregunta ya usada."),
              e("div", { className: "field" }, e("label", null, "Usuario"), e("input", { value: authName, onChange: ev => setAuthName(ev.target.value), placeholder: "maycol" })),
              e("div", { className: "field" }, e("label", null, "Password local"), e("input", { type: "password", value: authPass, onChange: ev => setAuthPass(ev.target.value), placeholder: "Solo se guarda en este navegador" })),
              authMessage && e("div", { className: "line bad" }, authMessage),
              e("div", { className: "auth-actions" },
                e("button", { className: `btn ${authMode === "login" ? "primary" : ""}`, onClick: () => { setAuthMode("login"); handleAuth("login"); } }, "Iniciar sesion"),
                e("button", { className: `btn ${authMode === "signup" ? "primary" : ""}`, onClick: () => { setAuthMode("signup"); handleAuth("signup"); } }, "Crear cuenta")
              ),
              e("p", { className: "small" }, "Nota: esta version usa localStorage para practicar. Para produccion en GitHub con varios dispositivos, despues se puede conectar a Firebase, Supabase o una API propia.")
            )
          )
        );
      }

      return e(React.Fragment, null,
        e(ThreeScene),
        e("div", { className: "shell" },
          e("aside", { className: "rail" },
            e("div", { className: "brand" }, e("div", { className: "logo" }, "EN"), e("div", null, e("h1", null, "SHL Style", e("br"), "English Lab"), e("small", null, "Candidate practice mode"))),
            e("div", { className: "stats" },
              e("div", { className: "stat" }, e("span", null, "Rondas"), e("strong", null, stats.rounds)),
              e("div", { className: "stat" }, e("span", null, "Aciertos"), e("strong", null, stats.wins)),
              e("div", { className: "stat" }, e("span", null, "Racha"), e("strong", null, stats.streak))
            ),
            e("div", { className: "user-chip" },
              e("span", { className: "small" }, "Usuario activo"),
              e("strong", null, currentUser),
              e("span", { className: "small" }, `${userAccount?.usedQuestionIds?.length || 0} preguntas usadas bloqueadas`),
              e("button", { className: "btn", onClick: logout }, "Cerrar sesion")
            ),
            e("div", { className: "source-card" },
              e("strong", null, "AMCAT voice focus"),
