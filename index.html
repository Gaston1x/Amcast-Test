<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMCAST Real Voice Simulation</title>
  <style>
    :root {
      --bg: #edf3f5;
      --paper: #ffffff;
      --ink: #182a33;
      --muted: #667983;
      --line: #d7e1e5;
      --soft: #f6f9fa;
      --green: #00a36c;
      --green-dark: #087750;
      --blue: #2866d7;
      --cyan: #0a9fb2;
      --amber: #f2a51a;
      --red: #c94343;
      --navy: #233746;
      --shadow: 0 18px 44px rgba(21, 45, 58, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,0) 34%),
        radial-gradient(circle at 86% 12%, rgba(10,159,178,.14), transparent 30%),
        radial-gradient(circle at 12% 88%, rgba(0,163,108,.13), transparent 28%),
        var(--bg);
      font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .top {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 24px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(25, 47, 59, .08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      letter-spacing: 0;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      box-shadow: 0 8px 18px rgba(0, 128, 104, .28);
      position: relative;
      overflow: hidden;
    }

    .call-logo {
      font-size: 0;
      isolation: isolate;
    }

    .call-logo::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      z-index: -1;
    }

    .headset-band {
      width: 25px;
      height: 22px;
      border: 4px solid #fff;
      border-bottom: 0;
      border-radius: 24px 24px 0 0;
      position: absolute;
      top: 10px;
      left: 8px;
    }

    .headset-ear {
      width: 7px;
      height: 14px;
      border-radius: 5px;
      background: #fff;
      position: absolute;
      top: 23px;
    }

    .headset-ear.left { left: 7px; }
    .headset-ear.right { right: 7px; }

    .headset-boom {
      width: 15px;
      height: 4px;
      border-radius: 999px;
      background: #fff;
      position: absolute;
      right: 7px;
      bottom: 9px;
      transform: rotate(-10deg);
    }

    .headset-boom::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      right: -2px;
      top: -1px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0;
      line-height: 1.1;
    }

    .brand span, .session-chip span {
      color: var(--muted);
      font-size: .78rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 42px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
      color: var(--navy);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .icon-btn:hover { border-color: #aab9c0; background: #fff; }

    .session-chip {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-size: .9rem;
    }

    .layout {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 180px;
      gap: 18px;
      align-items: start;
    }

    .panel, .test-window, .login-card {
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 16px;
      display: grid;
      gap: 10px;
    }

    .panel-title {
      margin: 0;
      font-size: .86rem;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #526873;
      font-weight: 800;
    }

    .section-list {
      display: grid;
      gap: 8px;
    }

    .section-tab {
      width: 100%;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      text-align: left;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
      color: var(--ink);
    }

    .section-tab.active {
      border-color: rgba(0,163,108,.5);
      background: #eefbf6;
    }

    .letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: var(--navy);
      font-weight: 900;
      font-size: .85rem;
    }

    .section-tab.active .letter { background: var(--green); }
    .section-tab b { display: block; font-size: .88rem; }
    .section-tab small { display: block; color: var(--muted); line-height: 1.25; }

    .mic-card {
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #cad8dd;
      background: linear-gradient(180deg, #fff, #f7fbfc);
      display: grid;
      gap: 8px;
    }

    .meter {
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #dce6ea;
      border: 1px solid #c5d2d7;
    }

    .meter > div {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--amber), var(--red));
      transition: width .08s linear;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .82rem;
    }

    input[type="range"] { width: 100%; accent-color: var(--green); }

    .ai-box {
      padding: 14px;
      border-radius: 8px;
      color: #17303b;
      background: linear-gradient(135deg, #f4fbff, #effbf5);
      border: 1px solid #c8dde2;
      display: grid;
      gap: 10px;
    }

    .ai-box h3 {
      margin: 0;
      font-size: .95rem;
    }

    .ai-box p {
      margin: 0;
      color: #425d67;
      line-height: 1.45;
      font-size: .9rem;
    }

    .test-window {
      min-height: calc(100vh - 110px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
    }

    .test-head {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .crumb {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #c8d8dd;
      color: #405964;
      background: var(--soft);
      font-size: .8rem;
      font-weight: 800;
    }

    .badge.green {
      background: #eaf9f2;
      border-color: rgba(0,163,108,.34);
      color: var(--green-dark);
    }

    .timer {
      min-width: 92px;
      height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      color: white;
      background: var(--navy);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
    }

    .instruction {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #f7fafb;
      color: #435963;
      line-height: 1.45;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 0;
      min-height: 520px;
    }

    .exam-card {
      padding: 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.98)),
        repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, transparent 1px 52px);
    }

    .phase-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      color: var(--green-dark);
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .prompt-area {
      min-height: 320px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 28px;
      border-radius: 8px;
      border: 1px solid #dbe6e9;
      background: #fff;
    }

    .prompt-inner {
      width: min(780px, 100%);
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    .section-letter-big {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      font-size: 2.2rem;
      font-weight: 950;
      box-shadow: 0 14px 28px rgba(0,130,100,.26);
    }

    .prompt-text {
      margin: 0;
      color: #162b34;
      font-size: clamp(1.35rem, 2.4vw, 2.35rem);
      font-weight: 800;
      line-height: 1.24;
      letter-spacing: 0;
    }

    .prompt-text.small {
      font-size: clamp(1.08rem, 1.7vw, 1.45rem);
      font-weight: 650;
      color: #263f49;
    }

    .hint {
      width: min(720px, 100%);
      margin: 0;
      color: var(--muted);
      font-size: .98rem;
      line-height: 1.5;
    }

    .answer-box {
      width: min(760px, 100%);
      padding: 14px;
      border: 1px solid #cad8dd;
      border-radius: 8px;
      background: #f8fbfc;
      text-align: left;
      color: #243f4a;
      line-height: 1.45;
    }

    textarea {
      width: min(760px, 100%);
      min-height: 88px;
      resize: vertical;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #c4d3d8;
      background: #fff;
      color: var(--ink);
      line-height: 1.45;
    }

    textarea:focus, input:focus {
      outline: 3px solid rgba(0,163,108,.18);
      border-color: var(--green);
    }

    .wave {
      height: 62px;
      width: min(440px, 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .wave span {
      width: 7px;
      height: 18px;
      border-radius: 99px;
      background: linear-gradient(180deg, var(--cyan), var(--green));
      animation: pulse 900ms ease-in-out infinite;
      transform-origin: center;
    }

    .wave span:nth-child(2n) { animation-delay: 100ms; height: 34px; }
    .wave span:nth-child(3n) { animation-delay: 220ms; height: 50px; }
    .wave span:nth-child(4n) { animation-delay: 340ms; height: 28px; }

    @keyframes pulse {
      0%, 100% { transform: scaleY(.45); opacity: .55; }
      50% { transform: scaleY(1.2); opacity: 1; }
    }

    .prep-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green-dark);
      background:
        radial-gradient(circle, #fff 0 58%, transparent 59%),
        conic-gradient(var(--green) var(--angle, 0deg), #dfe9ec 0);
      font-size: 2.2rem;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .side-diagnostics {
      border-left: 1px solid var(--line);
      background: #f8fbfc;
      padding: 18px;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .diag-card {
      padding: 14px;
      border: 1px solid #d4e1e5;
      border-radius: 8px;
      background: #fff;
      display: grid;
      gap: 6px;
    }

    .diag-card h4 {
      margin: 0;
      font-size: .85rem;
      text-transform: uppercase;
      color: #526873;
    }

    .diag-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
      font-size: .86rem;
    }

    .status-light {
      display: inline-grid;
      grid-template-columns: 10px auto;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      font-weight: 750;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(242,165,26,.13);
    }

    .dot.ready { background: var(--green); box-shadow: 0 0 0 4px rgba(0,163,108,.15); }
    .dot.hot { background: var(--red); box-shadow: 0 0 0 4px rgba(201,67,67,.14); }

    .controls {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: #fff;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: var(--green);
      color: white;
      font-weight: 850;
    }

    .btn:hover { filter: brightness(.97); }
    .btn:disabled { cursor: not-allowed; opacity: .52; }
    .btn.secondary { color: var(--ink); background: #eef3f5; border-color: #c8d5da; }
    .btn.blue { background: var(--blue); }
    .btn.dark { background: var(--navy); }
    .btn.red { background: var(--red); }

    .progress-rail {
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px 10px;
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 110px);
      overflow: auto;
    }

    .progress-rail h3 {
      margin: 0;
      text-align: center;
      color: #526873;
      font-size: .8rem;
      text-transform: uppercase;
    }

    .dots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .step-dot {
      width: 30px;
      height: 30px;
      margin: auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: .72rem;
      color: #506670;
      border: 1px solid #cbd8dd;
      background: #fff;
      font-weight: 800;
    }

    .step-dot.done {
      color: white;
      background: var(--navy);
      border-color: var(--navy);
    }

    .step-dot.current {
      color: white;
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(0,163,108,.16);
    }

    .result {
      padding: 28px;
      display: grid;
      gap: 18px;
    }

    .score-hero {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 20px;
      align-items: center;
      padding: 20px;
      border: 1px solid #d5e3e7;
      border-radius: 8px;
      background: #f8fbfc;
    }

    .score-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: auto;
      display: grid;
      place-items: center;
      color: var(--green-dark);
      background:
        radial-gradient(circle, #fff 0 59%, transparent 60%),
        conic-gradient(var(--green) var(--angle, 0deg), #dfe8eb 0);
      font-size: 2rem;
      font-weight: 950;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .mini-card {
      padding: 14px;
      border: 1px solid #d5e3e7;
      border-radius: 8px;
      background: #fff;
    }

    .mini-card b { display: block; margin-bottom: 6px; }
    .mini-card span { color: var(--muted); line-height: 1.4; font-size: .9rem; }

    .login-wrap {
      min-height: calc(100vh - 65px);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(520px, 100%);
      padding: 28px;
      display: grid;
      gap: 16px;
      text-align: center;
    }

    .login-card input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #c7d4d9;
      border-radius: 8px;
      padding: 0 14px;
      text-align: center;
    }

    .login-card h2 { margin: 0; font-size: 1.8rem; }
    .login-card p { margin: 0; color: var(--muted); line-height: 1.5; }

    .review-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .review-table th, .review-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: .9rem;
    }

    .review-table th {
      background: #f4f8f9;
      color: #526873;
      text-transform: uppercase;
      font-size: .75rem;
    }

    @media (max-width: 1150px) {
      .layout { grid-template-columns: 1fr; }
      .progress-rail { max-height: none; }
      .dots { grid-template-columns: repeat(12, 1fr); }
      .stage { grid-template-columns: 1fr; }
      .side-diagnostics { border-left: 0; border-top: 1px solid var(--line); grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 720px) {
      .top { align-items: flex-start; flex-direction: column; padding: 12px 14px; }
      .top-actions { justify-content: flex-start; }
      .layout { padding: 12px; gap: 12px; }
      .exam-card { padding: 16px; }
      .prompt-area { padding: 16px; min-height: 260px; }
      .controls { align-items: stretch; flex-direction: column; }
      .btn { width: 100%; }
      .side-diagnostics, .cards, .score-hero { grid-template-columns: 1fr; }
      .dots { grid-template-columns: repeat(8, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const SECTION_DATA = [
      {
        id: "A",
        title: "Short Questions",
        instruction: "Listen to the short information. After the beep, answer the question in one complete sentence.",
        ai: "Section A will begin now. Listen carefully to the short story, remember the details, and answer in a complete sentence.",
        prep: 2,
        speak: 15,
        revealPrompt: true,
        items: [
          {
            prompt: "Your name is Laura. You are twenty-one years old. You feel sad today because you missed your physics class. Question: What is your age?",
            display: "Listen to the short information, then answer the question.",
            expected: "I am twenty-one years old.",
            keywords: ["twenty-one", "21", "years", "old"],
            hint: "Use: I am ... years old."
          },
          {
            prompt: "Laura loves reading books in her free time. Today she read a humor book because she wanted to feel better. Question: Do you like reading books?",
            display: "Listen to the short information, then answer the question.",
            expected: "Yes, I like reading books.",
            keywords: ["yes", "like", "reading", "books"],
            hint: "A short natural answer is enough, but make it a full sentence."
          },
          {
            prompt: "A traveler lost his wallet at the airport. He reported it to security and cancelled his cards. Question: What did the traveler cancel?",
            display: "Listen to the short information, then answer the question.",
            expected: "The traveler cancelled his cards.",
            keywords: ["cancelled", "cards"],
            hint: "Use past tense: cancelled."
          },
          {
            prompt: "Nina received a message about suspicious activity on her account. She changed her password and enabled two-factor authentication. Question: What security step did Nina enable?",
            display: "Listen to the short information, then answer the question.",
            expected: "Nina enabled two-factor authentication.",
            keywords: ["enabled", "two-factor", "authentication"],
            hint: "Say the technical phrase slowly and clearly."
          }
        ]
      },
      {
        id: "B",
        title: "Conversation",
        instruction: "Listen to the situation and the agent question. Respond as the customer would respond.",
        ai: "Section B is a conversation. You will hear a real-life situation. Answer naturally and do not give extra information.",
        prep: 2,
        speak: 12,
        revealPrompt: true,
        items: [
          {
            prompt: "Situation: You want to order one pizza and one bottle of juice. You will pay cash. Agent asks: Pickup or delivery?",
            display: "Situation: Order one pizza and one bottle of juice. Pay cash. Agent asks: Pickup or delivery?",
            expected: "I would like delivery, please.",
            keywords: ["delivery"],
            hint: "Answer only the agent's question."
          },
          {
            prompt: "Situation: You lost your bank card this morning and need to block it. Agent asks: How can I help you today?",
            display: "Customer lost a bank card and wants to block it. Agent asks: How can I help you today?",
            expected: "I lost my card and I would like to block it.",
            keywords: ["lost", "card", "block"],
            hint: "State the problem and the action."
          },
          {

    const STORAGE_KEY = "amcast-real-simulation-v2";
    const RESULT_KEY = "amcast-real-results-v2";

    function normalize(text) {
      return (text || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function scoreItem(item, response, sectionId, volumeScore) {
      const clean = normalize(response);
      const tokens = clean.split(" ").filter(Boolean);
      const keywords = (item.keywords || []).map(normalize).filter(Boolean);
      const matched = keywords.filter(key => clean.includes(key));
      const keywordScore = keywords.length ? matched.length / keywords.length : 0;
      const expectedTokens = normalize(item.full || item.expected).split(" ").filter(Boolean);
      const shared = expectedTokens.filter(word => clean.includes(word)).length;
      const similarity = expectedTokens.length ? shared / expectedTokens.length : 0;
      const lengthScore = tokens.length >= 4 ? 1 : Math.max(tokens.length / 4, .2);
      const clarityProxy = Math.min(1, volumeScore || .35);
      const base = sectionId === "E"
        ? (.42 * keywordScore) + (.32 * lengthScore) + (.18 * clarityProxy) + (.08 * similarity)
        : (.50 * keywordScore) + (.25 * similarity) + (.15 * lengthScore) + (.10 * clarityProxy);
      return Math.round(Math.max(0, Math.min(1, base)) * 100);
    }

    function levelFromAverage(score) {
      if (score >= 82) return { level: "B2", pass: true, label: "Strong pass" };
      if (score >= 68) return { level: "B1", pass: true, label: "Pass" };
      if (score >= 52) return { level: "A2", pass: false, label: "Borderline" };
      return { level: "Below A2", pass: false, label: "Needs practice" };
    }

    function useSpeechAndMic() {
      const [ready, setReady] = useState(false);
      const [level, setLevel] = useState(0);
      const [message, setMessage] = useState("Microphone not connected");
      const [transcript, setTranscript] = useState("");
      const [supported, setSupported] = useState(false);
      const streamRef = useRef(null);
      const analyserRef = useRef(null);
      const rafRef = useRef(null);
      const recognitionRef = useRef(null);

      useEffect(() => {
        setSupported(Boolean(window.SpeechRecognition || window.webkitSpeechRecognition));
        return () => {
          cancelAnimationFrame(rafRef.current);
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch (error) {}
          }
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(track => track.stop());
          }
        };
      }, []);

      async function requestMic() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          streamRef.current = stream;
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 1024;
          const source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);
          analyserRef.current = analyser;
          const data = new Uint8Array(analyser.fftSize);

          const tick = () => {
            analyser.getByteTimeDomainData(data);
            let sum = 0;
            for (let index = 0; index < data.length; index += 1) {
              const value = (data[index] - 128) / 128;
              sum += value * value;
            }
            const rms = Math.sqrt(sum / data.length);
            setLevel(Math.min(1, rms * 8));
            rafRef.current = requestAnimationFrame(tick);
          };

          tick();
          setReady(true);
          setMessage("Microphone ready");
          return true;
        } catch (error) {
          setMessage("Microphone permission failed. Allow microphone access in the browser.");
          setReady(false);
          return false;
        }
      }

      function startRecognition() {
        setTranscript("");
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setMessage("Speech recognition is not available. Use the manual answer box.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = event => {
          let text = "";
          for (let index = 0; index < event.results.length; index += 1) {
            text += event.results[index][0].transcript + " ";
          }
          setTranscript(text.trim());
        };
        recognition.onerror = () => setMessage("Speech recognition paused. You can continue with the manual answer box.");
        recognition.onend = () => {};
        recognitionRef.current = recognition;
        try {
          recognition.start();
          setMessage("Recording and listening");
        } catch (error) {
          setMessage("Speech recognition is already active.");
        }
      }

      function stopRecognition() {
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (error) {}
        }
        setMessage("Recording stopped");
      }

      return { ready, level, message, transcript, setTranscript, supported, requestMic, startRecognition, stopRecognition };
    }

    let speechRunId = 0;

    function getExamEnglishVoice() {
      if (!window.speechSynthesis) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      const preferredNames = [
        "Natural",
        "Online",
        "Neural",
        "Microsoft Aria",
        "Microsoft Ava",
        "Microsoft Emma",
        "Microsoft Jenny",
        "Microsoft Sonia",
        "Microsoft Libby",
        "Google US English",
        "Samantha",
        "Victoria",
        "Karen",
        "Moira",
        "Tessa"
      ];
      const avoidNames = ["David", "Mark", "Daniel", "Alex", "Fred", "George", "Thomas"];
      const englishVoices = voices.filter(voice => /^en[-_]/i.test(voice.lang || ""));
      const scored = englishVoices.map(voice => {
        const name = voice.name.toLowerCase();
        let score = 0;
        if (name.includes("natural")) score += 120;
        if (name.includes("online")) score += 90;
        if (name.includes("neural")) score += 90;
        if (name.includes("google")) score += 35;
        if (name.includes("microsoft")) score += 30;
        preferredNames.forEach((preferred, index) => {
          if (name.includes(preferred.toLowerCase())) score += 80 - Math.min(index, 30);
        });
        if (name.includes("zira")) score -= 35;
        if (name.includes("desktop")) score -= 45;
        avoidNames.forEach(avoid => {
          if (name.includes(avoid.toLowerCase())) score -= 120;
        });
        return { voice, score };
      }).sort((a, b) => b.score - a.score);
      return scored[0]?.voice
        || englishVoices.find(voice => !avoidNames.some(name => voice.name.toLowerCase().includes(name.toLowerCase())))
        || englishVoices[0]
        || null;
    }

    function formatExamSpeech(text) {
      return (text || "")
        .replace(/\bSituation:/g, "Situation. ")
        .replace(/\bAgent asks:/g, "Agent asks. ")
        .replace(/\bManager asks:/g, "Manager asks. ")
        .replace(/\bQuestion:/g, "Question. ")
        .replace(/\bblank\b/gi, "blank")
        .replace(/\s+/g, " ")
        .trim();
    }

    function speechParts(text) {
      return formatExamSpeech(text)
        .split(/(?<=[.!?])\s+/)
        .flatMap(part => part.split(/\s+(?=Question\.|Situation\.|Agent asks\.|Manager asks\.)/))
        .map(part => part.trim())
        .filter(Boolean);
    }

    function speak(text, enabled = true, retried = false) {
      if (!enabled || !window.speechSynthesis) return;
      speechRunId += 1;
      const currentRun = speechRunId;
      window.speechSynthesis.cancel();
      const voice = getExamEnglishVoice();
      if (!voice && !retried) {
        setTimeout(() => speak(text, enabled, true), 450);
        return;
      }
      const parts = speechParts(text);
      let index = 0;

      function speakNext() {
        if (currentRun !== speechRunId) return;
        if (index >= parts.length) {
          return;
        }
        const utterance = new SpeechSynthesisUtterance(parts[index]);
        utterance.lang = "en-US";
        if (voice) utterance.voice = voice;
        utterance.rate = .88;
        utterance.pitch = .98;
        utterance.volume = .96;
        utterance.onend = () => {
          index += 1;
          const pause = parts[index - 1]?.match(/^(Situation|Question|Agent asks|Manager asks)\./) ? 420 : 180;
          setTimeout(speakNext, pause);
        };
        window.speechSynthesis.speak(utterance);
      }

      speakNext();
    }

    function App() {
      const savedProfile = useMemo(() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (error) { return null; }
      }, []);
      const [profile, setProfile] = useState(savedProfile);
      const [name, setName] = useState(savedProfile?.name || "");
      const [sectionIndex, setSectionIndex] = useState(0);
      const [itemIndex, setItemIndex] = useState(0);
      const [phase, setPhase] = useState("intro");
      const [timeLeft, setTimeLeft] = useState(0);
      const [manual, setManual] = useState("");
      const [answers, setAnswers] = useState([]);
      const [sensitivity, setSensitivity] = useState(.16);
      const [silenceSeconds, setSilenceSeconds] = useState(2.8);
      const [voiceOn, setVoiceOn] = useState(true);
      const [isRecording, setIsRecording] = useState(false);
      const [voiceStarted, setVoiceStarted] = useState(false);
      const [lastVoiceAt, setLastVoiceAt] = useState(Date.now());
      const [peakLevel, setPeakLevel] = useState(0);
      const mic = useSpeechAndMic();

      const section = SECTION_DATA[sectionIndex];
      const item = section.items[itemIndex];
      const totalItems = SECTION_DATA.reduce((sum, part) => sum + part.items.length, 0);
      const globalIndex = SECTION_DATA.slice(0, sectionIndex).reduce((sum, part) => sum + part.items.length, 0) + itemIndex;
      const completed = answers.length;

      function listenDuration(targetItem = item) {
        const words = targetItem.prompt.split(/\s+/).filter(Boolean).length;
        return Math.max(8, Math.min(26, Math.ceil(words / 2) + 4));
      }

      useEffect(() => {
        if (phase === "intro") {
          setTimeLeft(0);
          speak(`${section.ai} Next section: ${section.id}, ${section.title}.`, voiceOn);
        }
      }, [sectionIndex, phase]);

      useEffect(() => {
        if (phase === "listen") {
          setManual("");
          mic.setTranscript("");
          speak(item.prompt, voiceOn);
        }
      }, [phase, sectionIndex, itemIndex]);

      useEffect(() => {
        if (!["listen", "prep", "speak"].includes(phase)) return;
        if (timeLeft <= 0) {
          if (phase === "listen") {
            setTimeLeft(section.prep);
            setPhase("prep");
          }
          if (phase === "prep") startAnswer();
          if (phase === "speak") finishAnswer("time");
          return;
        }
        const interval = setInterval(() => setTimeLeft(value => Math.max(0, value - 1)), 1000);
        return () => clearInterval(interval);
      }, [phase, timeLeft]);

      useEffect(() => {
        if (!isRecording || phase !== "speak") return;
        setPeakLevel(value => Math.max(value, mic.level));
        const speaking = mic.level >= sensitivity;
        if (speaking) {
          setVoiceStarted(true);
          setLastVoiceAt(Date.now());
        }
        if (voiceStarted && Date.now() - lastVoiceAt > silenceSeconds * 1000) {
          finishAnswer("silence");
        }
      }, [mic.level, isRecording, phase, sensitivity, silenceSeconds, voiceStarted, lastVoiceAt]);

      function saveProfile(event) {
        event.preventDefault();
        const cleanName = name.trim() || "Student";
        const next = { name: cleanName, createdAt: new Date().toISOString() };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        setProfile(next);
      }

      async function startAnswer() {
        let canRecord = mic.ready;
        if (!canRecord) canRecord = await mic.requestMic();
        if (!canRecord) {
          setIsRecording(false);
          setPhase("review");
          return;
        }
        setPeakLevel(0);
        setVoiceStarted(false);
        setLastVoiceAt(Date.now());
        setIsRecording(true);
        setTimeLeft(section.speak);
        mic.startRecognition();
        setPhase("speak");
      }

      function finishAnswer(reason = "manual") {
        mic.stopRecognition();
        setIsRecording(false);
        setPhase("review");
      }

      function beginItem() {
        setTimeLeft(listenDuration(item));
        setPhase("listen");
      }

      function submitAnswer() {
        const response = (manual.trim() || mic.transcript || "").trim();
        const volumeScore = Math.min(1, peakLevel / Math.max(.08, sensitivity));
        const score = scoreItem(item, response, section.id, volumeScore);
        const saved = {
          section: section.id,
          title: section.title,
          prompt: item.display || item.prompt,
          expected: item.full || item.expected,
          response: response || "(no transcript captured)",
          score,
          peak: Math.round(peakLevel * 100),
          time: new Date().toISOString()
        };
        const nextAnswers = [...answers, saved];
        setAnswers(nextAnswers);
        localStorage.setItem(RESULT_KEY, JSON.stringify(nextAnswers));

        if (itemIndex < section.items.length - 1) {
          const nextItem = section.items[itemIndex + 1];
          setTimeLeft(listenDuration(nextItem));
          setItemIndex(itemIndex + 1);
          setPhase("listen");
        } else if (sectionIndex < SECTION_DATA.length - 1) {
          setSectionIndex(sectionIndex + 1);
          setItemIndex(0);
          setPhase("intro");
        } else {
          setPhase("complete");
        }
      }

      function resetExam() {
        setSectionIndex(0);
        setItemIndex(0);
        setPhase("intro");
        setAnswers([]);
        setManual("");
        mic.setTranscript("");
        localStorage.removeItem(RESULT_KEY);
      }

      if (!profile) {
        return (
          <div className="app">
            <Header profile={profile} />
            <main className="login-wrap">

                <div className="mark call-logo" style={{margin: "0 auto", width: 64, height: 64}}>

                  <span className="headset-ear left" style={{width: 9, height: 20, top: 34, left: 12}}></span>
                  <span className="headset-ear right" style={{width: 9, height: 20, top: 34, right: 12}}></span>
                  <span className="headset-boom" style={{width: 22, height: 5, right: 10, bottom: 13}}></span>
                </div>
                <h2>AMCAST Real Voice Simulation</h2>
                <p>Practica un flujo estilo AMCAT/SVAR con secciones A-G, tiempos reales, instrucciones por voz, microfono y resultados por nivel.</p>
                <input value={name} onChange={event => setName(event.target.value)} placeholder="Tu nombre" />
                <button className="btn" type="submit">Create practice account</button>
              </form>
            </main>
          </div>
        );
      }

      return (
        <div className="app">
          <Header profile={profile} onResetProfile={() => { localStorage.removeItem(STORAGE_KEY); setProfile(null); }} />
          <main className="layout">
            <aside className="panel">
              <h2 className="panel-title">AMCAT Sequence</h2>
              <div className="section-list">
                {SECTION_DATA.map((part, index) => (
                  <button key={part.id} className={`section-tab ${index === sectionIndex ? "active" : ""}`} onClick={() => { setSectionIndex(index); setItemIndex(0); setPhase("intro"); }}>
                    <span className="letter">{part.id}</span>
                    <span><b>{part.title}</b><small>{part.items.length} tasks</small></span>
                  </button>
                ))}
              </div>
              <div className="mic-card">
                <div className="status-light"><span className={`dot ${mic.ready ? "ready" : ""}`}></span>{mic.ready ? "Mic ready" : "Mic setup"}</div>
                <div className="meter"><div style={{width: `${Math.min(100, mic.level * 100)}%`}}></div></div>
                <div className="slider-row"><span>Sensitivity</span><b>{Math.round(sensitivity * 100)}%</b></div>
                <input type="range" min=".05" max=".45" step=".01" value={sensitivity} onChange={event => setSensitivity(Number(event.target.value))} />
                <div className="slider-row"><span>Auto-stop silence</span><b>{silenceSeconds.toFixed(1)}s</b></div>
                <input type="range" min="1.4" max="4.5" step=".1" value={silenceSeconds} onChange={event => setSilenceSeconds(Number(event.target.value))} />
                <button className="btn secondary" onClick={mic.requestMic}>Request microphone</button>
              </div>
              <div className="ai-box">
                <h3>AI Proctor</h3>
                <p>{section.ai}</p>
                <button className="btn secondary" onClick={() => speak(`${section.ai} ${section.instruction}`, voiceOn)}>Play instruction</button>
                <label className="status-light">
                  <input type="checkbox" checked={voiceOn} onChange={event => setVoiceOn(event.target.checked)} />
                  Voice announcements
                </label>
              </div>
            </aside>

            <section className="test-window">
              <div className="test-head">
                <div className="crumb">
                  <span className="badge green">Section {section.id}</span>
                  <span className="badge">{section.title}</span>
                  <span className="badge">Task {itemIndex + 1} of {section.items.length}</span>
                </div>
                <div className="timer">{phase === "intro" || phase === "review" ? "--" : `${String(timeLeft).padStart(2, "0")}s`}</div>
              </div>
              <div className="instruction">{section.instruction}</div>
              {phase === "complete" ? (
                <Results answers={answers} resetExam={resetExam} />
              ) : (
                <>
                  <div className="stage">
                    <div className="exam-card">
                      <PhaseTitle phase={phase} />
                      <PromptArea
                        phase={phase}
                        section={section}
                        item={item}
                        timeLeft={timeLeft}
                        transcript={mic.transcript}
                        manual={manual}
                        setManual={setManual}
                        sensitivity={sensitivity}
                      />
                    </div>
                    <aside className="side-diagnostics">
                      <div className="diag-card">
                        <h4>Microphone</h4>
                        <div className="status-light"><span className={`dot ${mic.level >= sensitivity ? "ready" : mic.ready ? "" : "hot"}`}></span>{mic.level >= sensitivity ? "Voice detected" : mic.message}</div>
                        <p>Speech recognition: {mic.supported ? "available" : "manual fallback only"}</p>
                      </div>
                      <div className="diag-card">
                        <h4>Timing</h4>
                        <p>Listen: {listenDuration(item)}s. Prepare: {section.prep}s. Speak: {section.speak}s.</p>
                      </div>
                    </aside>
                  </div>
                  <Controls phase={phase} beginItem={beginItem} startAnswer={startAnswer} finishAnswer={finishAnswer} submitAnswer={submitAnswer} resetExam={resetExam} micReady={mic.ready} />
                </>
              )}
            </section>

            <aside className="progress-rail">
              <h3>Question Progress</h3>
              <div className="dots">
                {Array.from({length: totalItems}, (_, index) => (
                  <span key={index} className={`step-dot ${index < completed ? "done" : ""} ${index === globalIndex && phase !== "complete" ? "current" : ""}`}>{index + 1}</span>
                ))}
              </div>
            </aside>
          </main>
        </div>
      );
    }

    function Header({ profile, onResetProfile }) {
      return (
        <header className="top">
          <div className="brand">
            <div className="mark call-logo" aria-hidden="true">
              <span className="headset-band"></span>
              <span className="headset-ear left"></span>
              <span className="headset-ear right"></span>
              <span className="headset-boom"></span>
            </div>
            <div>
              <h1>AMCAST Real Simulation</h1>
              <span>Voice assessment practice A-G</span>
            </div>
          </div>
          <div className="top-actions">
            {profile && <div className="session-chip"><b>{profile.name}</b><span>Practice account</span></div>}
            <button className="icon-btn" title="Help">?</button>
            <button className="icon-btn" title="Accessibility">Aa</button>
            {profile && <button className="icon-btn" title="Exit profile" onClick={onResetProfile}>X</button>}
          </div>
        </header>
      );
    }

    function PhaseTitle({ phase }) {
      const labels = {
        intro: "Instructions",
        listen: "Listen Carefully",
        prep: "Get Ready",
        speak: "Speak Now",
        review: "Review Answer"
      };
      return <div className="phase-title">{labels[phase] || "Assessment"}</div>;
    }

    function PromptArea({ phase, section, item, timeLeft, transcript, manual, setManual, sensitivity }) {
      if (phase === "intro") {
        return (
          <div className="prompt-area">
            <div className="prompt-inner">
              <div className="section-letter-big">{section.id}</div>
              <p className="prompt-text">{section.title}</p>
              <p className="hint">{section.instruction}</p>
            </div>
          </div>
        );
      }

      if (phase === "listen") {
        return (
          <div className="prompt-area">
            <div className="prompt-inner">
              <div className="wave">{Array.from({length: 26}, (_, i) => <span key={i}></span>)}</div>
              <p className="prompt-text">Listen Carefully</p>
              <p className="hint">{section.revealPrompt ? item.display : "The sentence is hidden. Listen and repeat exactly."}</p>
            </div>
          </div>
        );
      }

      if (phase === "prep") {
        const angle = (timeLeft / Math.max(1, section.prep)) * 360;
        return (
          <div className="prompt-area">
            <div className="prompt-inner">
              <div className="prep-ring" style={{"--angle": `${angle}deg`}}>{timeLeft}</div>
              <p className="prompt-text">{section.id === "E" ? item.display : "Prepare your answer"}</p>
              <p className="hint">Recording starts automatically.</p>
            </div>
          </div>
        );
      }

      if (phase === "speak") {
        return (
          <div className="prompt-area">
            <div className="prompt-inner">
              <div className="wave">{Array.from({length: 22}, (_, i) => <span key={i}></span>)}</div>
              <p className={`prompt-text ${section.id === "D" ? "small" : ""}`}>{section.id === "D" ? "Repeat the sentence exactly." : (section.revealPrompt ? item.display : "Speak now.")}</p>
              <div className="answer-box"><b>Live transcript:</b> {transcript || "Listening..."}</div>
            </div>
          </div>
        );
      }

      return (
        <div className="prompt-area">
          <div className="prompt-inner">
            <p className="prompt-text">Check Your Answer</p>
            <div className="answer-box"><b>Transcript captured:</b><br />{transcript || "No transcript captured yet. Type what you said below."}</div>
            <textarea value={manual} onChange={event => setManual(event.target.value)} placeholder="Optional: type or fix the answer if the browser did not capture your voice correctly." />
            <div className="answer-box"><b>Expected answer:</b><br />{item.full || item.expected}</div>
          </div>
        </div>
      );
    }

    function Controls({ phase, beginItem, startAnswer, finishAnswer, submitAnswer, resetExam }) {
      return (
        <div className="controls">
          <button className="btn secondary" onClick={resetExam}>Restart test</button>
          <div style={{display: "flex", gap: 10, flexWrap: "wrap"}}>
            {phase === "intro" && <button className="btn blue" onClick={beginItem}>Start section</button>}
            {phase === "listen" && <button className="btn secondary" onClick={startAnswer}>Skip to recording</button>}
            {phase === "prep" && <button className="btn blue" onClick={startAnswer}>Record now</button>}
            {phase === "speak" && <button className="btn red" onClick={() => finishAnswer("manual")}>Stop recording</button>}
            {phase === "review" && <button className="btn" onClick={submitAnswer}>Submit answer</button>}
          </div>
        </div>
      );
    }

    function Results({ answers, resetExam }) {
      const average = answers.length ? Math.round(answers.reduce((sum, item) => sum + item.score, 0) / answers.length) : 0;
      const outcome = levelFromAverage(average);
      const angle = average * 3.6;
      const bySection = SECTION_DATA.map(section => {
        const sectionAnswers = answers.filter(answer => answer.section === section.id);
        const score = sectionAnswers.length ? Math.round(sectionAnswers.reduce((sum, answer) => sum + answer.score, 0) / sectionAnswers.length) : 0;
        return { id: section.id, title: section.title, score };
      });

      return (
        <div className="result">
          <div className="score-hero">
            <div className="score-circle" style={{"--angle": `${angle}deg`}}>{average}%</div>
            <div>
              <h2 style={{margin: "0 0 8px", fontSize: "2rem"}}>{outcome.label}</h2>
              <p style={{margin: 0, color: "var(--muted)", lineHeight: 1.5}}>Estimated English level: <b>{outcome.level}</b>. Result: <b>{outcome.pass ? "Passed practice threshold" : "Below practice threshold"}</b>. This is a local practice score based on transcript similarity, key words, answer length, and microphone level.</p>
            </div>
          </div>
          <div className="cards">
            {bySection.map(part => (
              <div className="mini-card" key={part.id}>
                <b>{part.id}. {part.title}</b>
                <span>{part.score}% average</span>
              </div>
            ))}
          </div>
          <table className="review-table">
            <thead>
              <tr><th>Section</th><th>Your answer</th><th>Expected</th><th>Score</th></tr>
            </thead>
            <tbody>
              {answers.map((answer, index) => (
                <tr key={index}>
                  <td>{answer.section}</td>
                  <td>{answer.response}</td>
                  <td>{answer.expected}</td>
                  <td><b>{answer.score}%</b></td>
                </tr>
              ))}
            </tbody>
          </table>
          <button className="btn dark" onClick={resetExam}>Start new simulation</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
